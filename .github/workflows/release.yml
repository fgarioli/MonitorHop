name: release

on:
  push:
    tags: ["v*"]

# Builds the NSIS installer on a clean Windows runner, signs it with the
# updater key, assembles the latest.json manifest the updater polls, and
# publishes all three to a GitHub Release.
#
# Requires two repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           output of `cargo tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password chosen when generating it
# The matching public key lives in tauri.conf.json under plugins.updater.pubkey.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/gui/frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # A tag that fails its own tests should never become a release.
      - name: Build frontend
        working-directory: crates/gui/frontend
        run: npm run build

      - name: Test workspace
        run: cargo test --workspace

      - name: Build installer
        working-directory: crates/gui/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      # The tag is the source of truth for the version; a tag that disagrees
      # with tauri.conf.json would produce a release the updater can never
      # match, so fail loudly here instead of shipping it.
      - name: Verify tag matches tauri.conf.json version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $conf = (Get-Content crates/gui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $conf) {
            throw "tag $tag does not match tauri.conf.json version $conf"
          }
          Write-Host "version $conf"

      - name: Assemble latest.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $sigFile = Get-ChildItem target/release/bundle/nsis/*-setup.exe.sig | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer found under target/release/bundle/nsis" }
          if (-not $sigFile) { throw "no .sig found — is TAURI_SIGNING_PRIVATE_KEY set and createUpdaterArtifacts enabled?" }

          $manifest = [ordered]@{
            version   = $version
            notes     = "See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sigFile.FullName -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8
          Get-Content latest.json

          # Published alongside the installer so anyone can verify the download
          # without a code-signing certificate — see the README's SmartScreen note.
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower() +
            "  " + $installer.Name | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          gh release create "${{ github.ref_name }}" `
            "$($installer.FullName)" latest.json SHA256SUMS.txt `
            --title "${{ github.ref_name }}" `
            --generate-notes
